version: "3.8"

services:
  scraper:
    build:
      context: ./apps/scraper
      dockerfile: Dockerfile
    container_name: linkaboard-scraper
    ports:
      - "8080"
    environment:
      - NODE_ENV=production
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - linkaboard-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/v1/scraper/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: linkaboard-server
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - SCRAPER_URL=${SCRAPER_URL}
      - SCRAPPER_URL=${SCRAPER_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - scraper
    restart: unless-stopped
    networks:
      - linkaboard-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  linkaboard-network:
    driver: bridge

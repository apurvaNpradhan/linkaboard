version: "3.8"

services:
  scraper:
    build:
      context: ./apps/scraper
      dockerfile: Dockerfile
    container_name: linkaboard-scraper
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - linkaboard-network
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: linkaboard-server
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - SCRAPER_URL=http://scraper:8080
      - SCRAPPER_URL=http://scraper:8080
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - scraper
    restart: unless-stopped
    networks:
      - linkaboard-network
networks:
  linkaboard-network:
    driver: bridge
